<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Войти в Instagram</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <img src="../images/inst.png" alt="Instagram">
        </div>

        <div class="separator"></div>

        <div class="right-section">
            <div class="login-box">
                <h1 class="login-title">Войти в Instagram</h1>
                
                <form>
                    <div class="input-group">
                        <input type="text" placeholder="Имя пользователя, номер мобильного телефона или электронны...">
                    </div>
                    
                    <div class="input-group">
                        <input type="password" placeholder="Пароль">
                    </div>
                    
                    <button type="submit" class="login-button">Войти</button>
                    
                    <div class="forgot-password">
                        Забыли пароль?
                    </div>
                    
                    <div class="divider">ИЛИ</div>
                    
                    <div class="facebook-login">
                        
                        Войти через Facebook
                    </div>
                </form>
            </div>
            
            <div class="signup-box">
                У вас ещё нет аккаунта?<a href="#" class="signup-link">Создать новый аккаунт</a>
            </div>
            
           
        </div>
    </div>
</body>
</html>
