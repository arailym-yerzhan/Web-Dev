<div class="photos-container">
  <div class="header">
    <h1>Album Photos</h1>
    <button (click)="goBack()" class="btn-back">Back to Album</button>
  </div>

  <div *ngIf="loading" class="loading">
    Loading photos...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && photos.length === 0 && !error" class="empty-state">
    <p>No photos found for this album.</p>
  </div>

  <div *ngIf="!loading && photos.length > 0" class="photos-grid">
    <div *ngFor="let photo of photos" class="photo-item">
      <img [src]="photo.thumbnailUrl" [alt]="photo.title" class="photo-image" />
      <p class="photo-title">{{ photo.title }}</p>
    </div>
  </div>
</div>
