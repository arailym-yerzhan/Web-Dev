<div class="detail-container">
  <div *ngIf="loading" class="loading">
    Loading album...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && album" class="album-detail">
    <div class="detail-header">
      <h1>{{ album.title }}</h1>
      <p class="detail-id">Album ID: {{ album.id }}</p>
    </div>

    <div class="form-group">
      <label>User ID:</label>
      <input type="number" [(ngModel)]="album.userId" disabled class="form-input" />
    </div>

    <div class="form-group">
      <label>Title:</label>
      <input type="text" [(ngModel)]="album.title" class="form-input" />
    </div>

    <div class="button-group">
      <button (click)="saveAlbum()" [disabled]="saving" class="btn btn-save">
        {{ saving ? 'Saving...' : 'Save' }}
      </button>
      <button (click)="viewPhotos()" class="btn btn-photos">
        View Photos
      </button>
      <button (click)="goBack()" class="btn btn-secondary">
        Back
      </button>
    </div>
  </div>
</div>
